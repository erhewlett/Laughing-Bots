<text x="536.8" y="738" font-family="DejaVu Sans" font-size="18" fill="#6B7787">validates every request and response</text>
<text x="112" y="794" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#6B7787">ROUTERS</text>
