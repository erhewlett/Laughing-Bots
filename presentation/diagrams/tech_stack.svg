<svg xmlns="http://www.w3.org/2000/svg" width="2420" height="1460" viewBox="0 0 2420 1460"><rect width="2420" height="1460" fill="#F4F7FB"/>
<text x="70" y="80" font-family="DejaVu Sans" font-size="52" font-weight="bold" fill="#1B2430">JobHopper technology stack</text>
<text x="70" y="128" font-family="DejaVu Sans" font-size="28" fill="#6B7787">A browser talking to one Python API, which owns the only connection to the database.</text>
