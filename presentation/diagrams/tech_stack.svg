<text x="743.2" y="360" font-family="DejaVu Sans" font-size="18" fill="#6B7787">compiled to one stylesheet</text>
<rect x="112" y="394" width="393.0" height="74" rx="37.0" fill="#FFFFFF" stroke="#3F5C99" stroke-width="2.5"/>
