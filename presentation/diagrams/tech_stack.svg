<text x="614.0" y="1018.0" font-family="DejaVu Sans" font-size="23" fill="#6B7787">SQLAlchemy session per request  ·  parameterised queries only</text>
<rect x="70" y="1050" width="1620" height="250" rx="20" fill="#FFFFFF" stroke="#C9D2DE" stroke-width="2"/>
