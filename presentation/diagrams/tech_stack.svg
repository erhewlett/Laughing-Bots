<rect x="523.0" y="394" width="228.0" height="74" rx="37.0" fill="#FFFFFF" stroke="#3F5C99" stroke-width="2.5"/>
<text x="547.0" y="430" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">wordcloud.js</text>
<text x="547.0" y="454" font-family="DejaVu Sans" font-size="18" fill="#6B7787">canvas rendering</text>
<rect x="769.0" y="394" width="339.59999999999997" height="74" rx="37.0" fill="#FFFFFF" stroke="#3F5C99" stroke-width="2.5"/>
<text x="793.0" y="430" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">Figma</text>
<text x="793.0" y="454" font-family="DejaVu Sans" font-size="18" fill="#6B7787">every screen designed first</text>
