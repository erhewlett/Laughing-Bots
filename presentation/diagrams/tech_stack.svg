<path d="M1750,950 L1750,590 Q1750,570 1770,570 L1764,570 L1764,970 L1770,970 Q1750,970 1750,950 Z" fill="#5B6472"/>
<rect x="1750" y="570" width="14" height="400" fill="#5B6472"/>
<text x="1792" y="620" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#5B6472">How we kept it working</text>
<text x="1792" y="654" font-family="DejaVu Sans" font-size="22" fill="#6B7787">Every merge had to pass this</text>
<rect x="1792" y="662" width="10" height="46" rx="5" fill="#5B6472"/>
<text x="1820" y="688" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">pytest</text>
<text x="1820" y="716" font-family="DejaVu Sans" font-size="20" fill="#6B7787">222 backend tests</text>
<rect x="1792" y="732" width="10" height="46" rx="5" fill="#5B6472"/>
<text x="1820" y="758" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">Jest + jsdom</text>
<text x="1820" y="786" font-family="DejaVu Sans" font-size="20" fill="#6B7787">28 frontend tests</text>
<rect x="1792" y="802" width="10" height="46" rx="5" fill="#5B6472"/>
<text x="1820" y="828" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">GitHub Actions</text>
<text x="1820" y="856" font-family="DejaVu Sans" font-size="20" fill="#6B7787">both suites run on every pull request</text>
<rect x="1792" y="872" width="10" height="46" rx="5" fill="#5B6472"/>
<text x="1820" y="898" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">Pull requests</text>
<text x="1820" y="926" font-family="DejaVu Sans" font-size="20" fill="#6B7787">48 merged into main, reviewed first</text>
<rect x="1750" y="1050" width="600" height="250" rx="20" fill="#FFFFFF" stroke="#C9D2DE" stroke-width="2"/>
<path d="M1750,1280 L1750,1070 Q1750,1050 1770,1050 L1764,1050 L1764,1300 L1770,1300 Q1750,1300 1750,1280 Z" fill="#3F5C99"/>
<rect x="1750" y="1050" width="14" height="250" fill="#3F5C99"/>
<text x="1792" y="1100" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#3F5C99">How we worked</text>
<text x="1792" y="1134" font-family="DejaVu Sans" font-size="22" fill="#6B7787">Four people, one main branch</text>
<circle cx="1802" cy="1150" r="8" fill="#3F5C99"/>
<text x="1828" y="1158" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#1B2430">Figma</text>
<text x="1828" y="1182" font-family="DejaVu Sans" font-size="18" fill="#6B7787">designs agreed before anyone implemented them</text>
<circle cx="1802" cy="1202" r="8" fill="#3F5C99"/>
<text x="1828" y="1210" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#1B2430">198 commits, 48 pull requests</text>
<text x="1828" y="1234" font-family="DejaVu Sans" font-size="18" fill="#6B7787">one feature branch per task</text>
<circle cx="1802" cy="1254" r="8" fill="#3F5C99"/>
<text x="1828" y="1262" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#1B2430">Pinned dependency versions</text>
<text x="1828" y="1286" font-family="DejaVu Sans" font-size="18" fill="#6B7787">all four machines resolve the same set</text>
<rect x="70" y="1340" width="2310" height="86" rx="16" fill="#FFFFFF" stroke="#C9D2DE" stroke-width="2"/>
<text x="104" y="1376" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1B2430">The rule that shaped the whole design:</text>
<text x="104" y="1408" font-family="DejaVu Sans" font-size="23" fill="#6B7787">the browser never touches the database, and it never decides anything it could be lied to about — scoring, ownership and validation all happen in the API.</text>
</svg>