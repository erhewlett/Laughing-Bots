<text x="112" y="1134" font-family="DejaVu Sans" font-size="22" fill="#6B7787">One SQLite file, created and migrated by the app itself</text>
<rect x="112" y="1166" width="393.59999999999997" height="74" rx="37.0" fill="#FFFFFF" stroke="#9A4F70" stroke-width="2.5"/>
<text x="136" y="1202" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">SQLAlchemy 2.0 ORM</text>
<text x="136" y="1226" font-family="DejaVu Sans" font-size="18" fill="#6B7787">typed models, no raw SQL strings</text>
<rect x="523.5999999999999" y="1166" width="264.0" height="74" rx="37.0" fill="#FFFFFF" stroke="#9A4F70" stroke-width="2.5"/>
<text x="547.5999999999999" y="1202" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">SQLite</text>
<text x="547.5999999999999" y="1226" font-family="DejaVu Sans" font-size="18" fill="#6B7787">backend/jobhopper.db</text>
<rect x="805.5999999999999" y="1166" width="285.6" height="74" rx="37.0" fill="#FFFFFF" stroke="#9A4F70" stroke-width="2.5"/>
<text x="829.5999999999999" y="1202" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">14 tables</text>
<text x="829.5999999999999" y="1226" font-family="DejaVu Sans" font-size="18" fill="#6B7787">with composite indexes</text>
