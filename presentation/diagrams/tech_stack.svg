<text x="294" y="896" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1B2430">security</text>
<text x="294" y="920" font-family="DejaVu Sans" font-size="18" fill="#6B7787">bcrypt hashing + PyJWT tokens</text>
<rect x="649.2" y="860" width="372.0" height="74" rx="37.0" fill="#FFFFFF" stroke="#1F7A6B" stroke-width="2.5"/>
<text x="673.2" y="896" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1B2430">keywords</text>
<text x="673.2" y="920" font-family="DejaVu Sans" font-size="18" fill="#6B7787">skill extraction from postings</text>
<rect x="1039.2" y="860" width="292.79999999999995" height="74" rx="37.0" fill="#FFFFFF" stroke="#1F7A6B" stroke-width="2.5"/>
<text x="1063.2" y="896" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1B2430">ingest / autoseed</text>
<text x="1063.2" y="920" font-family="DejaVu Sans" font-size="18" fill="#6B7787">keeps the data fresh</text>
<line x1="580.0" y1="970" x2="580.0" y2="1034" stroke="#1F7A6B" stroke-width="4"/>
