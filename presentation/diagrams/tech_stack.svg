<text x="614.0" y="538.0" font-family="DejaVu Sans" font-size="23" fill="#6B7787">HTTP + JSON  ·  Authorization: Bearer &lt;JWT&gt;  ·  CORS allow-list  ·  gzip</text>
<rect x="70" y="570" width="1620" height="400" rx="20" fill="#FFFFFF" stroke="#C9D2DE" stroke-width="2"/>
<path d="M70,950 L70,590 Q70,570 90,570 L84,570 L84,970 L90,970 Q70,970 70,950 Z" fill="#1F7A6B"/>
