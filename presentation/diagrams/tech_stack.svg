<text x="1070.4" y="807" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1B2430">meta</text>
<text x="112" y="884" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#6B7787">SERVICES</text>
