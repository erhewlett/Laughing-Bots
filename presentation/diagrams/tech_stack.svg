<text x="112" y="274" font-family="DejaVu Sans" font-size="22" fill="#6B7787">Runs in the browser - no framework, no build step</text>
<rect x="112" y="300" width="318.0" height="74" rx="37.0" fill="#FFFFFF" stroke="#3F5C99" stroke-width="2.5"/>
