<rect x="448.0" y="300" width="253.2" height="74" rx="37.0" fill="#FFFFFF" stroke="#3F5C99" stroke-width="2.5"/>
<text x="472.0" y="336" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1B2430">Bootstrap 5.3</text>
<text x="472.0" y="360" font-family="DejaVu Sans" font-size="18" fill="#6B7787">grid, navbar, forms</text>
<rect x="719.2" y="300" width="328.8" height="74" rx="37.0" fill="#FFFFFF" stroke="#3F5C99" stroke-width="2.5"/>
