<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="author" content="The Laughing Bots">
        <meta name="description" content="This is the user info page for JobHopper.">
        <meta name="keywords" content="Jobs, JobHopper, Job Search, Skills, Computer Science, Word Cloud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JobHopper User Info</title>

        <!-- references -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <!-- page header -->
        <header class="bg-primary p-3">

            <div class="container-fluid">
                <div class="fs-5 fw-semibold p-2 text-center" style="max-width: 120px; color: #F7E4E0;">
                    JobHopper
                </div>
            </div>

        </header>

        <!-- [MAIN CONTENT]-->
        <main class="container">
            <!-- div to hold logo, welcome message, and generate new word cloud button -->
            <div class="row align-items-center">

                <!-- logo takes up four columns on all screens-->
                <div class="col-4">
                    <img src="../assets/JobHopper_logo.svg" class="img-fluid ms-5" alt="JobHopper Logo">
                </div>

                <div class="col-8 d-flex flex-column align-items-center">

                    <div id="user-welcome-message" class="col-9 bg-info fw-semibold p-4 text-center rounded-4 mb-4 ms-5">
                        Welcome, Guest!
                    </div>

                    <button
                        id="generate-new-word-cloud-btn"
                        type="button"
                        class="btn btn-secondary col-6 fw-semibold p-4 text-dark rounded-4 ms-5"
                        >
                        Generate New Word Cloud!
                    </button>

                    <button
                        id="view-roadmap-btn"
                        type="button"
                        class="btn btn-info col-6 fw-semibold p-4 text-dark rounded-4 ms-5 mt-3"
                        >
                        My Skill Roadmap
                    </button>

                </div>
                
            </div>
            
            <!-- [ERROR MESSAGE FOR USER] -->
            <div id="user-info-error-message" class="alert alert-danger text-center m-5" style="display: none;">
                <div class="d-flex justify-content-between align-items-center">
                    <span id="user-info-error-text"></span>
                    <button type="button" class="btn-close" onclick="document.getElementById('user-info-error-message').style.display='none'"></button>
                </div>
            </div>

            <!-- user info -->
            <section class="row mt-5 pt-3">
                <!-- user game history -->
                <div class="col-6">
                    <h4 class="mb-5 bg-primary text-center text-white p-3 rounded-2">Recent Game History</h4>
                    <div class="table-responsive">
                        <table class="table table-hover table-striped-columns align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="p-3 text-center">Game Keyword</th>
                                    <th scope="col" class="p-3 text-center">Difficulty</th>
                                    <th scope="col" class="p-3 text-center">Game Score</th>
                                    <th scope="col" class="p-3 text-center">Played</th>
                                </tr>
                            </thead>

                            <!-- Filled from GET /me/games. Every attempt is
                                 stored, so show the recent ones rather than
                                 just the last. -->
                            <tbody id="game-history-body">
                                <tr>
                                    <td class="p-3 text-center" colspan="4">No available data yet</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- recent word cloud history -->
                <div class="col-6">
                    <h4 class="mb-5 bg-primary text-center text-white p-3 rounded-2">Recent Word Clouds</h4>
                    <div class="table-responsive">
                        <table class="table table-hover table-striped-columns align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="p-3 text-center w-50">Word Cloud Role</th>
                                    <th scope="col" class="p-3 text-center w-50">Regenerate Word Cloud</th>
                                </tr>
                            </thead> 
                        

                            <tbody>
                                <tr id="recent-word-cloud-row-1">
                                    <td class="p-3 text-center" id="recent-word-cloud-role-1">N/A</td>
                                    <td>
                                        <div class="d-flex justify-content-center">
                                            <button
                                                id="rerun-word-cloud-btn-1"
                                                type="button"
                                                class="btn btn-secondary view-recent-word-cloud-btn fw-semibold text-dark rounded-4 px-5"
                                            >
                                            Search Again
                                            </button>
                                        </div>
                                    </td>
                                </tr>

                                <tr id="recent-word-cloud-row-2">
                                    <td class="p-3 text-center" id="recent-word-cloud-role-2">N/A</td>
                                    <td>
                                        <div class="d-flex justify-content-center">
                                            <button
                                                id="rerun-word-cloud-btn-2"
                                                type="button"
                                                class="btn btn-secondary view-recent-word-cloud-btn fw-semibold text-dark rounded-4 px-5"
                                            >
                                            Search Again
                                            </button>
                                        </div>
                                    </td>
                                </tr>

                                <tr id="recent-word-cloud-row-3">
                                    <td class="p-3 text-center" id="recent-word-cloud-role-3">N/A</td>
                                    <td>
                                        <div class="d-flex justify-content-center">
                                            <button
                                                id="rerun-word-cloud-btn-3"
                                                type="button"
                                                class="btn btn-secondary view-recent-word-cloud-btn fw-semibold text-dark rounded-4 px-5"
                                            >
                                            Search Again
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>   

            </section>

        </main>

        <!-- sign out -->
        <div class="row mt-5">
            <div class="col-12 text-center">
                <a href="#" id="sign-out-link" class="text-decoration-underline text-muted">Sign Out</a>
            </div>
        </div>

        <!-- footer -->
        <footer class="bg-info text-white text-center py-3 mt-4 fixed-bottom">
            <div class="container">
                Created by the Laughing Bots
            </div>
        </footer>

        <!-- JS SCRIPT -->
        <script src="../js/user_info_view_page.js"></script>
    </body>

</html>
