<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="author" content="The Laughing Bots">
        <meta name="description" content="This is the user info page for JobHopper.">
        <meta name="keywords" content="Jobs, JobHopper, Job Search, Skills, Computer Science, Word Cloud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JobHopper User Info</title>

        <!-- references -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <!-- page header -->
        <header class="bg-info p-3">

            <div class="container-fluid">
                <div class="bg-secondary text-dark p-2 text-center" style="max-width: 120px;">
                    JobHopper
                </div>
            </div>

        </header>

        <!-- [MAIN CONTENT]-->
        <main class="container">
            <!-- div to hold logo, welcome message, and generate new word cloud button -->
            <div class="row align-items-center">

                <!-- logo takes up four columns on all screens-->
                <div class="col-4">
                    <img src="../assets/JobHopper_logo.svg" class="img-fluid ms-5" alt="JobHopper Logo">
                </div>

                <div class="col-8 d-flex flex-column align-items-center">

                    <div id="user-welcome-message" class="col-9 bg-info fw-semibold p-4 text-center rounded-4 mb-4 ms-5">
                        Welcome, Guest!
                    </div>

                    <button
                        id="generate-new-word-cloud-btn"
                        type="button"
                        class="btn btn-secondary col-6 fw-semibold p-4 text-dark rounded-4 ms-5"
                        >
                        Generate New Word Cloud!
                    </button>

                </div>
                
            </div>

            <!-- user info -->
            <section class="row mt-5 pt-3">
                <!-- user game history -->
                <div class="col-6">
                    <h4 class="mb-5 bg-primary text-center text-white p-3 rounded-2">Recent Game History</h4>
                    <div class="table-responsive">
                        <table class="table table-hover table-striped-columns align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="p-3 text-center w-50">Game Keyword</th>
                                    <th scope="col" class="p-3 text-center w-50">Game Score</th>
                                </tr>
                            </thead> 
                        

                            <tbody>
                                <tr>
                                    <td class="p-3 text-center" id="recent-game-keyword">N/A</td>
                                    <td class="p-3 text-center" id="recent-game-score">N/A</td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- recent word cloud history -->
                <div class="col-6">
                    <h4 class="mb-5 bg-primary text-center text-white p-3 rounded-2">Recent Word Clouds</h4>
                    <div class="table-responsive">
                        <table class="table table-hover table-striped-columns align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="p-3 text-center w-50">Word Cloud Date</th>
                                    <th scope="col" class="p-3 text-center w-50">View Word Cloud</th>
                                </tr>
                            </thead> 
                        

                            <tbody>
                                <tr id="recent-word-cloud-row-1">
                                    <td class="p-3 text-center" id="recent-word-cloud-date-1">N/A</td>
                                    <td>
                                        <div class="d-flex justify-content-center">
                                            <button
                                                id="rerun-word-cloud-btn-1"
                                                type="button"
                                                class="btn btn-secondary view-recent-word-cloud-btn fw-semibold text-dark rounded-4 px-5"
                                            >
                                            Search Again
                                            </button>
                                        </div>
                                    </td>
                                </tr>

                                <tr id="recent-word-cloud-row-2">
                                    <td class="p-3 text-center" id="recent-word-cloud-date-2">N/A</td>
                                    <td>
                                        <div class="d-flex justify-content-center">
                                            <button
                                                id="rerun-word-cloud-btn-2"
                                                type="button"
                                                class="btn btn-secondary view-recent-word-cloud-btn fw-semibold text-dark rounded-4 px-5"
                                            >
                                            Search Again
                                            </button>
                                        </div>
                                    </td>
                                </tr>

                                <tr id="recent-word-cloud-row-3">
                                    <td class="p-3 text-center" id="recent-word-cloud-date-3">N/A</td>
                                    <td>
                                        <div class="d-flex justify-content-center">
                                            <button
                                                id="rerun-word-cloud-btn-3"
                                                type="button"
                                                class="btn btn-secondary view-recent-word-cloud-btn fw-semibold text-dark rounded-4 px-5"
                                            >
                                            Search Again
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>   

            </section>

        </main>


        <!-- footer -->
        <footer class="bg-primary text-white text-center py-3 mt-5">
            <div class="container">
                Created by the Laughing Bots
            </div>
        </footer>

        <!-- JS SCRIPT -->
        <script src="../js/user_info_view_page.js"></script>
    </body>

</html>
