<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="author" content="The Laughing Bots">
        <meta name="description" content="This is the word cloud creation page for JobHopper.">
        <meta name="keywords" content="Jobs, JobHopper, Job Search, Skills, Computer Science, Word Cloud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JobHopper Word Cloud Creation</title>

        <!-- references -->

        <link rel="icon" href="../assets/JobHopper_logo.svg" type="image/svg+xml">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <!-- page header -->
        <header class="bg-primary p-3">

            <div class="fs-5 fw-semibold p-2 text-center" style="max-width: 120px; color: #F7E4E0;">
                <a href="../html/user_info_view_page.html" class="text-decoration-none d-block" style="color: #F7E4E0;">
                    JobHopper
                </a>
            </div>

        </header>

        <!-- [MAIN CONTENT] -->

        <!-- container for all main content -->
        <main class="container"> 
            <!-- logo and welcome message-->
            <!-- row class aligns items horizontally so they sit next to each other -->
            <div class="row align-items-center m-3">

                <!-- logo takes up three columns on all screens-->
                <div class="col-3">
                    <img src="../assets/JobHopper_logo.svg" class="img-fluid" alt="JobHopper Logo">
                </div>

                <div class="col-6 ms-auto">
                    <div id="word-cloud-creation-welcome-message" class="bg-secondary text-dark p-4 text-center rounded-4">
                        Welcome, Guest!
                    </div>
                </div>

            </div>

            <!-- [ERROR MESSAGE FOR USER] -->
            <div id="word-cloud-inputs-error-message" class="alert alert-danger text-center mx-5" style="display: none;"></div>


            <div class="bg-primary text-center text-white p-4 rounded-top-4">Generate a Tools and Skills Word Cloud</div>
                <!-- [WORD CLOUD INPUTS] -->
                <form id="wordCloudForm">
                    <div class="card p-5 bg-dark bg-opacity-10 border-0 rounded-bottom-4">

                        <!-- JOB TITLE SELECTION MENU -->
                        <div class="mb-4">
                            <label for="jobTitleInput" class="form-label fw-semibold">Job Title:</label>
                            <div class="row">    
                                <div class="col-12 col-md-3">
                                    <select class="form-select" id="jobTitleInput" required>
                                        <option value="" selected disabled>Select a job title...</option>

                                        <option value="Cloud Security Engineer">Cloud Security Engineer</option>
                                        <option value="Data Analyst">Data Analyst</option>
                                        <option value="Frontend Developer">Frontend Developer</option>
                                        <option value="Software Engineer">Software Engineer</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- LOCATION INPUT -->
                        <div class="mb-4 col-12 col-md-5">
                            <label for="locationInput" class="form-label fw-semibold">Location:</label>
                            <input
                                class="form-control"
                                list="locationOptions"
                                id="locationInput"
                                placeholder="Select a location..."
                                autocomplete="off"
                                aria-label="Location"
                            >
                            <datalist id="locationOptions">
                                <!-- to be populated dynamically based on locations from backend -->
                            </datalist>
                        </div>

                        <!-- DESIRED SALARY RANGE INPUT GROUP -->
                        <fieldset class="mb-4">
                            <legend class="form-label fw-semibold" style="float: none; width: auto; font-size: 1rem; padding: 0;">Desired Minimum Salary:</legend>
                            <div class="row">
                                <div class="col-12 col-md-6">
                                    <div class="input-group">
                                        <!-- minimum salary -->
                                        <span class="input-group-text">$</span>
                                        <input
                                            type="number"
                                            class="form-control"
                                            id="minimumSalaryInput"
                                            placeholder="e.g 30000"
                                            pattern="[0-9]+"
                                            aria-label="Minimum Salary"
                                        >
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <!-- KEYWORD AMOUNT MENU -->
                        <div class="mb-4">
                            <label for="wordCountSelect" class="form-label fw-semibold">Up to how many keywords would you like to see in the word cloud?</label>
                            <div class="row">    
                                <div class="col-12 col-md-3">
                                    <select class="form-select" id="wordCountSelect" required>
                                        <option value="" selected disabled>Select a number...</option>

                                        <option value="10">10</option>
                                        <option value="20">20</option>
                                        <option value="30">30</option>
                                        <option value="40">40</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- WORD CLOUD SHAPE MENU -->
                        <div class="mb-4">
                            <label for="wordCloudShapeSelect" class="form-label fw-semibold">Please select a shape for the word cloud:</label>
                            <div class="row">
                                <div class="col-12 col-md-3">
                                    <select class="form-select" id="wordCloudShapeSelect" required>
                                        <option value="" selected disabled>Select a shape...</option>

                                        <!-- Labels capitalised to match the same
                                             dropdown on the registration page.
                                             The values stay lower case: they go
                                             straight to wordcloud2, which only
                                             knows its shapes by those names. -->
                                        <option value="circle">Circle</option>
                                        <option value="diamond">Diamond</option>
                                        <option value="square">Square</option>
                                        <option value="star">Star</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    

                        <!-- SUBMIT BUTTON -->
                        <div class="d-flex justify-content-center mt-5">
                            <button
                                id="generate-word-cloud-btn"
                                type="submit"
                                class="btn btn-secondary fw-semibold px-5 py-3 text-dark fs-5 rounded-4"
                            >
                            Generate Word Cloud
                            </button>
                        </div>
                    </div>    
                </form>
            </div>
        </main>

        <!-- footer -->
        <footer class="bg-info text-white text-center py-3 mt-5">
            <div class="container">
                Created by the Laughing Bots
            </div>
        </footer>
        
        <!-- script -->
        <script type="module" src="../js/word_cloud_inputs.js"></script>

    </body>

</html>
