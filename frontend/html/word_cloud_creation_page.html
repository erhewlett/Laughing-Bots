<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="author" content="The Laughing Bots">
        <meta name="description" content="This is the word cloud creation page for JobHopper.">
        <meta name="keywords" content="Jobs, JobHopper, Job Search, Skills, Computer Science, Word Cloud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JobHopper Word Cloud Creation</title>

        <!-- references -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <!-- page header -->
        <header class="bg-info p-3">

            <div class="container-fluid">
                <div class="bg-secondary text-dark p-2 text-center" style="max-width: 120px;">
                    JobHopper
                </div>
            </div>

        </header>

        <!-- [MAIN CONTENT] -->

        <!-- container for all main content -->
        <main class="container"> 
            <!-- logo and welcome message-->
            <!-- row class aligns items horizontally so they sit next to each other -->
            <div class="row align-items-center m-3">

                <!-- logo takes up three columns on all screens-->
                <div class="col-3">
                    <img src="../assets/JobHopper_logo.svg" class="img-fluid" alt="JobHopper Logo">
                </div>

                <div class="col-6 ms-auto">
                    <div class="bg-secondary text-dark p-4 text-center rounded-4">
                        Welcome {USER}!
                    </div>
                </div>

            </div>

            <div class="bg-primary text-center text-white p-4 rounded-top-4">Generate a Tools and Skills Word Cloud</div>
                <!-- [WORD CLOUD INPUTS] -->
                <form id="wordCloudForm">
                    <div class="card p-5 bg-dark bg-opacity-10 border-0 rounded-bottom-4">
                        <!-- JOB TITLE INPUT FIELD -->
                        <div class="mb-4">
                            <!-- label -->
                            <label for="jobTitleInput" class="form-label fw-semibold">Job Title:</label>
                            <!-- input constraints -->
                            <!-- note: this field is left as not required since the user will need to input at least one from (Job Title, Job Industry)-->
                            <input
                                type="text"
                                class="form-control"
                                id="jobTitleInput"
                                placeholder="e.g. Frontend Engineer, Product Manager..."
                                aria-describedby="jobRequirementHelp"
                            >
                        </div>

                        <!-- JOB INDUSTRY MENU -->
                        <div class="mb-4">
                            <!-- label -->
                            <label for="jobIndustryInput" class="form-label fw-semibold">Job Industry:</label>
                            <!-- input constraints -->
                            <input
                                type="text"
                                class="form-control"
                                id="jobIndustryInput"
                                placeholder="e.g. Healthcare"
                                aria-describedby="jobRequirementHelp"
                            >
                            <div id="jobRequirementHelp" class="form-text text-muted mt-2">
                                Please provide a job title, job industry, or both to create your word cloud.
                            </div>
                        </div>

                        <!-- LOCATION INPUT -->
                        <div class="mb-4">
                            <label for="locationInput" class="form-label fw-semibold">Location:</label>
                            <input
                                type="text"
                                class="form-control"
                                id="locationInput"
                                pattern="[a-zA-Z0-9, \-.']+"
                                placeholder="e.g. Atlanta, GA"
                            >
                        </div>

                        <!-- DESIRED SALARY RANGE INPUT GROUP -->
                        <fieldset class="mb-4">
                            <legend class="form-label fw-semibold" style="float: none; width: auto; font-size: 1rem; padding: 0;">Desired Annual Salary Range:</legend>
                            <!-- input group (for side-by-side fields) -->
                            <div class="row">
                                <div class="col-12 col-md-6">
                                    <div class="input-group">
                                        <!-- minimum salary -->
                                        <span class="input-group-text">$</span>
                                        <input
                                            type="number"
                                            class="form-control"
                                            id="minimumSalaryInput"
                                            placeholder="e.g 30000"
                                            pattern="[0-9]+"
                                            aria-label="Minimum Salary"
                                        >

                                        <!-- separator -->
                                        <span class="input-group-text">to</span>

                                        <!-- maximum salary -->
                                        <span class="input-group-text">$</span>
                                        <input
                                            type="number"
                                            class="form-control"
                                            id="maximumSalaryInput"
                                            placeholder="e.g. 250000"
                                            pattern="[0-9]+"
                                            aria-label="Maximum Salary"
                                        >
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <!-- KEYWORD AMOUNT MENU -->
                        <div class="mb-4">
                            <label for="wordCountSelect" class="form-label fw-semibold">How many keywords would you like to see in the word cloud?</label>
                            <div class="row">    
                                <div class="col-12 col-md-3">
                                    <select class="form-select" id="wordCountSelect" required>
                                        <option value="" selected disabled>Select a number...</option>

                                        <option value="10">10</option>
                                        <option value="20">20</option>
                                        <option value="30">30</option>
                                        <option value="40">40</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- WORD CLOUD SHAPE MENU -->
                        <div class="mb-4">
                            <label for="wordCloudShapeSelect" class="form-label fw-semibold">Please select a shape for the word cloud:</label>
                            <div class="row">
                                <div class="col-12 col-md-3">
                                    <select class="form-select" id="wordCloudShapeSelect" required>
                                        <option value="" selected disabled>Select a shape...</option>

                                        <option value="placeholderShape1">Placeholder Shape 1</option>
                                        <option value="placeholderShape2">Placeholder Shape 2</option>
                                        <option value="placeholderShape3">Placeholder Shape 3</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    

                        <!-- SUBMIT BUTTON -->
                        <div class="d-flex justify-content-center mt-5">
                            <button
                                id="generate-word-cloud-btn"
                                type="submit"
                                class="btn btn-secondary fw-semibold px-5 py-3 text-dark fs-5 rounded-4"
                            >
                            Generate Word Cloud
                            </button>
                        </div>
                    </div>    
                </form>
            </div>
        </main>

        <!-- footer -->
        <footer class="bg-primary text-white text-center py-3 mt-5">
            <div class="container">
                Created by the Laughing Bots
            </div>
        </footer>

    </body>

</html>
