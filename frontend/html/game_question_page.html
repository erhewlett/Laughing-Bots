<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="author" content="The Laughing Bots">
        <meta name="description" content="This is the game question page for JobHopper.">
        <meta name="keywords" content="Jobs, JobHopper, Job Search, Skills, Computer Science, Word Cloud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JobHopper Q&A Game!</title>

        <!-- references -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">

    </head>
    <body class="game_question_page">

        <!-- page header -->
        <header class="bg-info p-3">

            <div class="container-fluid">
                <!-- [CHANGED] href="#" TO href="user_info_view_page.html" -->
                <a class="navbar-brand register-brand" href="user_info_view_page.html">
                    JobHopper
                </a>
            </div>

        </header>

        <!-- [MAIN CONTENT] -->
        <main class="container my-5">
            <div class="row game-set-up">
                <!-- Timer -->
                <div class="col-12 col-md-4 clock">
                    <div class="back-drop">
                        <p id="time-title">Time Remaining:</p>
                        <p class="time-left">2:00</p>
                    </div>
                </div>

                <!-- Difficulty -->
                <div class="col-12 col-md-4 mode">
                    <div class="back-drop">
                        <p id="difficulty-title">Game Difficulty:</p><br>
                        <p id="difficulty-chosen">Medium</p>
                    </div>
                </div>
                
                <!-- Points -->
                <div class="col-12 col-md-4 points">
                    <div class="back-drop">
                        <p id="point-title">Score:</p>
                        <div class="points-added">0 pts</div>
                        <div class="score-percentage">0%</div>
                    </div>
                </div>

            </div>
            <!-- progress bar -->
            <div class="progress mb-5" role="progressbar" aria-label="question progress bar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div
                    class="progress-bar bg-primary"
                    style="width: 0%"
                >
                </div>
            </div>

            <!-- question and options row -->
            <div class="row">

                <!-- question box -->
                <div class="col-12 col-md-6 mb-4">
                    <div id="question-container" class="question-box bg-info rounded-3 border d-flex justify-content-center align-items-center">
                        <h3 id="question-text" class="text-center">Placeholder Question</h3>
                    </div>
                </div>

                <!-- answer choices -->
                <div class="col-12 col-md-6">
                    <div id="choices-container" class="list-group">
                        <label class="list-group-item d-flex align-items-center mb-5 rounded-3 border-3">
                            <input class="form-check-input me-3" type="radio" name="answerChoice">
                            <span class="choice-text">Choice 1</span>
                        </label>

                        <label class="list-group-item d-flex align-items-center mb-5 rounded-3 border-3">
                            <input class="form-check-input me-3" type="radio" name="answerChoice">
                            <span class="choice-text">Choice 2</span>                      
                        </label>

                        <label class="list-group-item d-flex align-items-center mb-5 rounded-3 border-3">
                            <input class="form-check-input me-3" type="radio" name="answerChoice">
                            <span class="choice-text">Choice 3</span>                           
                        </label>

                        <label class="list-group-item d-flex align-items-center mb-5 rounded-3 border-3">
                            <input class="form-check-input me-3" type="radio" name="answerChoice">
                            <span class="choice-text">Choice 4</span>
                        </label>
                    </div>
                    <div class="invalid-feedback" id="game-display-error"></div>
                    <div class="d-flex justify-content-center mb-3">
                        <button
                            id="submit-answer-btn"
                            type="button"
                            class="btn btn-secondary fw-semibold px-5 py-3 text-dark fs-5 rounded-4"
                        >
                        Submit
                        </button>
                    

                    </div>
                </div>

            </div>
        </main>

        <!-- footer -->
        <footer class="bg-primary text-white text-center py-3 mt-5">
            <div class="container">
                Created by the Laughing Bots
            </div>
        </footer>
        <script src="../js/game_questions.js"></script>
    </body>
</html>
