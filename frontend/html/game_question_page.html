<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="author" content="The Laughing Bots">
        <meta name="description" content="This is the game question page for JobHopper.">
        <meta name="keywords" content="Jobs, JobHopper, Job Search, Skills, Computer Science, Word Cloud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JobHopper Q&A Game!</title>

        <!-- references -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">

    </head>
    <body>

        <!-- page header -->
        <header class="bg-info p-3">

            <div class="container-fluid">
                <div class="bg-secondary text-dark p-2 text-center" style="max-width: 120px;">
                    JobHopper
                </div>
            </div>

        </header>

        <!-- [MAIN CONTENT] -->
        <main class="container my-5">
            <!-- progress bar -->
            <div class="progress mb-5" role="progressbar" aria-label="question progress bar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div
                    class="progress-bar bg-primary"
                    style="width: 0%"
                >
                </div>
            </div>

            <!-- question and options row -->
            <div class="row align-items-center">

                <!-- question box -->
                <div class="col-12 col-md-6 mb-4">
                    <div id="question-container" class="question-box bg-info rounded-3 border m-3 d-flex justify-content-center align-items-center">
                        <h3 id="question-text" class="text-center">Placeholder Question</h3>
                    </div>
                </div>

                <!-- answer choices -->
                <div class="col-12 col-md-6">
                    <div id="choices-container" class="list-group me-3 ms-5">
                        <label class="list-group-item d-flex align-items-center mb-5 rounded-3 border-3">
                            <input class="form-check-input me-3" type="radio" name="answerChoice">
                            Choice 1
                        </label>

                        <label class="list-group-item d-flex align-items-center mb-5 rounded-3 border-3">
                            <input class="form-check-input me-3" type="radio" name="answerChoice">
                            Choice 2
                        </label>

                        <label class="list-group-item d-flex align-items-center mb-5 rounded-3 border-3">
                            <input class="form-check-input me-3" type="radio" name="answerChoice">
                            Choice 3
                        </label>

                        <label class="list-group-item d-flex align-items-center mb-5 rounded-3 border-3">
                            <input class="form-check-input me-3" type="radio" name="answerChoice">
                            Choice 4
                        </label>

                        <div class="d-flex justify-content-center mb-3">
                        <button
                            id="submit-answer-btn"
                            type="button"
                            class="btn btn-secondary fw-semibold px-5 py-3 text-dark fs-5 rounded-4"
                        >
                        Submit
                        </button>
                    </div>

                    </div>
                </div>

            </div>
        </main>

        <!-- footer -->
        <footer class="bg-primary text-white text-center py-3 mt-5">
            <div class="container">
                Created by the Laughing Bots
            </div>
        </footer>
    </body>
</html>
