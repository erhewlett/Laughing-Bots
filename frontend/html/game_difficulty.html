<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!--  cascadia code font -->
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <title>JobHopper Game Difficulty</title>
</head>
<body>
    <nav class="navbar sticky-top navbar-expand-md col-sm-12">
        <div class="container-fluid">
            <a class="navbar-brand register-brand" href="../html/main.html">
                    JobHopper
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link" aria-current="page" href="../html/user_info_view_page.html">Profile</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="../html/word_cloud_view_page.html">Word Cloud</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="../html/word_cloud_creation_page.html">Word Cloud Creation</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
    <div class="container block-around-all-content">
        <main class="main-body flex-grow-1 d-flex align-items-center">
            <div class="container-fluid boxOne">
                <div class="row headLiner">
                    <div class="col-12">
                        <h4>Choose a mode to play the Q&A game<br>
                            for <span id="skillDisplay"></span>
                        </h4>
                    </div>
                </div>
                <div class="row theBlock">
                   <div class="col-12 displayBlock">
                        <div class="row buttonLayout">
                            <button class="col-12 easyMode" id="easyBtn" data-difficulty="easy">Easy</button>
                            <button class="col-12 mediumMode" id="mediumBtn" data-difficulty="medium">Medium</button>
                            <button class="col-12 hardMode" id="hardBtn" data-difficulty="hard">Hard</button>
                        </div>
                   </div>
                   <div class="col-12 game-error"></div>
                </div>
            </div>
        </main>
    </div>
     <!-- footer -->
    <footer class="text-white text-center fixed py-3">
        <div class="container">
            Created by the Laughing Bots
        </div>
    </footer>
     <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/game_difficulty.js"></script>
</body>
</html>
