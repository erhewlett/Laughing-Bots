<!DOCTYPE html>

<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="author" content="The Laughing Bots">
        <meta name="description" content="This is the word cloud view page for JobHopper.">
        <meta name="keywords" content="Jobs, JobHopper, Job Search, Skills, Computer Science, Word Cloud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JobHopper Word Cloud</title>

        <!-- references -->

        <!-- Served from the repo, not a CDN: the demo has to render offline. -->
        <script src="../js/vendor/wordcloud2.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <!-- page header -->
        <header class="bg-primary p-3">

            <div class="fs-5 fw-semibold p-2 text-center" style="max-width: 120px; color: #F7E4E0;">
                <a href="../html/user_info_view_page.html" class="text-decoration-none d-block" style="color: #F7E4E0;">
                    JobHopper
                </a>
            </div>

        </header>

        <!-- [MAIN CONTENT] -->
        <!-- Spacing above the cloud is deliberately tighter than the other
             pages: every pixel here pushes the cloud further down the screen,
             and the whole cloud needs to be visible at once. -->
        <main class="container my-4">
            <h2 class="mb-3 text-center bg-secondary p-3 rounded-3">Your Customized Skills and Tools Word Cloud:</h2>

            <!-- dynamic word cloud title -->
            <h4 id="word-cloud-title" class="mb-3 text-muted">Loading title ...</h4>

            <!-- [ERROR MESSAGE FOR USER] -->
            <div id="word-cloud-view-error-message" class="alert alert-danger text-center mx-5" style="display: none;"></div>

            <!-- placeholder space for word cloud -->
            <div id="word-cloud-box" class="word-cloud-container d-flex justify-content-center align-items-center mb-3 bg-light border rounded-1">
                <p id="generating-word-cloud-text">Generating your word cloud...</p>
            </div>

            <!-- selection prompt -->
            <p class="text-center">Select any word to enter the Q&A game page.</p>

            <!-- removed: user is directed to game upon clicking on a word - implemented in word_cloud_render.js -->
            <!-- enter game button 
            <div class="d-flex justify-content-center m-5">
                <button
                    id="enter-game-btn"
                    type="button"
                    class="btn btn-secondary fw-bold px-5 py-3 text-dark fs-5 rounded-4"
                >
                Enter Game!
                </button>
            </div>
            -->
        </main>

        <!-- footer -->
        <footer class="bg-primary text-white text-center py-3 mt-5">
            <div class="container">
                Created by the Laughing Bots
            </div>
        </footer>

        <!-- JS SCRIPT -->
        <script type="module" src="../js/word_cloud_render.js"></script>
    </body>

</html>
