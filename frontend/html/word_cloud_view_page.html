<!DOCTYPE html>

<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="author" content="The Laughing Bots">
        <meta name="description" content="This is the word cloud view page for JobHopper.">
        <meta name="keywords" content="Jobs, JobHopper, Job Search, Skills, Computer Science, Word Cloud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JobHopper Word Cloud</title>

        <!-- references -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <!-- page header -->
        <header class="bg-info p-3">

            <div class="container-fluid">
                <div class="bg-secondary text-dark p-2 text-center" style="max-width: 120px;">
                    JobHopper
                </div>
            </div>

        </header>

        <!-- [MAIN CONTENT] -->
        <main class="container my-5">
            <h2 class="mb-5 text-center bg-secondary p-4 rounded-3">Your Customized Skills and Tools Word Cloud:</h2>

            <!-- dynamic word cloud title -->
            <h4 id="word-cloud-title" class="mb-5 text-muted">Loading title ...</h4>

            <!-- placeholder space for word cloud -->
            <div id="word-cloud-box" class="word-cloud-container d-flex justify-content-center align-items-center mb-5 mx-3 bg-light p-4 border rounded-1">
                <p>Wait for results...</p>
            </div>

            <!-- selection prompt -->
            <p>Select any word to enter the Q&A game.</p>

            <!-- enter game button -->
            <div class="d-flex justify-content-center m-5">
                <button
                    id="enter-game-btn"
                    type="button"
                    class="btn btn-secondary fw-bold px-5 py-3 text-dark fs-5 rounded-4"
                >
                Enter Game!
                </button>
            </div>
        </main>

        <!-- footer -->
        <footer class="bg-primary text-white text-center py-3 mt-5">
            <div class="container">
                Created by the Laughing Bots
            </div>
        </footer>

    </body>

</html>
